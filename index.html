<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Luxury Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress-bar"></div>
<div class="cursor"></div>

<header>
  <div class="logo">MOHINI</div>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <nav id="nav">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#work">Work</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section id="home" class="hero">
  <div class="hero-text">
    <h1>I am <span class="typing"></span></h1>
    <p>Modern luxury portfolio website</p>
    <button onclick="scrollToSection('work')">View Work</button>
  </div>
</section>

<section id="about">
<h2>About</h2>
<p>Clean modern portfolio design.</p>
</section>

<section id="work">
<h2>Work</h2>
<div class="grid">
<div class="card">Project 1</div>
<div class="card">Project 2</div>
<div class="card">Project 3</div>
</div>
</section>

<section id="contact">
<h2>Contact</h2>
<form>
<input placeholder="Name" required>
<input placeholder="Email" required>
<textarea placeholder="Message"></textarea>
<button>Send</button>
</form>
</section>

<footer class="footer">
<p>© 2026 Portfolio</p>
</footer>

<script src="script.js"></script>
</body>
</html>
